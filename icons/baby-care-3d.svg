    <filter id="softShadow" x="30" y="36" width="452" height="454" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#0F172A" flood-opacity="0.22"/>
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#BE185D" flood-opacity="0.14"/>
    </filter>
    <filter id="objectShadow" x="54" y="72" width="406" height="400" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
