<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Baby Care 3D icon</title>
  <desc id="desc">A soft 3D baby care icon with a baby face, milk bottle, heart and reminder clock in pastel glass style.</desc>
  <defs>
    <linearGradient id="base" x1="92" y1="58" x2="420" y2="458" gradientUnits="userSpaceOnUse">
